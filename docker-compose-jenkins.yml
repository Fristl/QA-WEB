services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    user: root
    ports:
      - "8082:8080"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins-network

networks:
  jenkins-network:
    driver: bridge
